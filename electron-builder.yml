# v0.1 内测打包配置：本地 ad-hoc 签名，不做 Developer ID 签名/公证。
# 公开分发前需要：Apple Developer 账号 + Developer ID Application 证书 + 公证（notarize）+ stapler，详见 README。
# 对外一律叫 PingPet：产物名、App 名、菜单名、官网、GitHub release 都用它。
#
# ⚠️ 不要把 productName 抄到 package.json 里，也不要改 package.json 的 name。
# Electron 的 userData 目录（~/Library/Application Support/<app.name>）取自 package.json 的
# productName ?? name，和这里的 productName 无关。本机实测目录是 desktop-pet-mvp。
# 一旦改动它，用户的设置、导入的皮肤包、以及 safeStorage 在钥匙串里的条目（服务名也按
# app.name 派生）会全部对不上号——设置清零、API Key 要重填。所以内部标识保持历史值不动，
# 只改用户看得见的名字。目录名用户永远看不到，不值得拿数据去换。
appId: io.github.yvestiny-aipm.pingpet
productName: PingPet
directories:
  buildResources: build
  output: release
# v0.4：注册 deskpet:// 自定义协议，让网页 deskpet://install?url=... 能唤起本 App 装宠物
protocols:
  - name: DeskPet Protocol
    schemes:
      - deskpet
files:
  - out/**
  - package.json
# v0.3：把官方内置皮肤包打进 App 的 Resources/pet-packs/official
extraResources:
  - from: resources/pet-packs/official
    to: pet-packs/official
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  icon: build/icon.png
  # identity: null → 跳过 Developer ID 签名；afterPack 会补一个本地 ad-hoc 签名，方便本机/内测启动。
  identity: null
afterPack: scripts/adhoc-sign-mac.cjs
dmg:
  # 文件名不带版本号：README 和官网给的是 releases/latest/download/PingPet-macOS-arm64.dmg
  # 这种「永远指向最新版」的固定地址，只要产物名和它对不上，每次发版都得手动改名，
  # 忘一次那个链接就 404。让构建直接产出正确的名字。
  artifactName: ${productName}-macOS-${arch}.${ext}
npmRebuild: false
